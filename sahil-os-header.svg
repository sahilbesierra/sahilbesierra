  <text x="22" y="160" fill="#7E96BA" font-family="monospace" font-size="12">CURRENT FOCUS</text>
  <text x="298" y="160" fill="#F1F6FF" font-family="monospace" font-size="13" text-anchor="end">DSA + AI/ML</text>
  <rect x="22" y="183" width="276" height="5" rx="2.5" fill="#1A2C49"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">SAHIL.OS — Personal Developer Workspace</title>
<desc id="desc">A deep navy operating-system inspired developer profile banner with electric blue typography and a custom system panel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101F"/><stop offset="1" stop-color="#101F3A"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1677FF"/><stop offset="1" stop-color="#62C5FF"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#1677FF" stop-opacity=".32"/><stop offset="1" stop-color="#1677FF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#6D91C7" stroke-opacity=".10" stroke-width="1"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<rect width="1200" height="430" rx="22" fill="url(#grid)"/>
<circle cx="950" cy="205" r="260" fill="url(#orb)" filter="url(#soft)"/>
<rect x="34" y="30" width="1132" height="370" rx="15" fill="none" stroke="#31517D" stroke-opacity=".7"/>
<rect x="34" y="30" width="1132" height="42" rx="15" fill="#111F36"/>
<path d="M34 57V72H1166V57" fill="#111F36"/>
<circle cx="60" cy="51" r="5" fill="#FF647C"/><circle cx="80" cy="51" r="5" fill="#FFC45C"/><circle cx="100" cy="51" r="5" fill="#55D6A2"/>
<text x="124" y="56" fill="#8FA8CD" font-family="monospace" font-size="13" letter-spacing="2">SAHIL.OS  /  USER WORKSPACE</text>
<text x="1070" y="56" fill="#5B9FFF" font-family="monospace" font-size="12" text-anchor="end">BUILD 2026.11</text>
<text x="82" y="145" fill="#6AAEFF" font-family="monospace" font-size="15" letter-spacing="4">HELLO, WORLD. I'M</text>
<text x="76" y="232" fill="#F1F6FF" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-3">SAHIL</text>
<text x="76" y="306" fill="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-3">SWAMI<span fill="#F1F6FF">.</span></text>
<text x="82" y="345" fill="#A7B9D5" font-family="monospace" font-size="15" letter-spacing="1.8">COMPUTER SCIENCE  /  SOFTWARE  /  AI &amp; ML</text>
<g transform="translate(790 112)">
  <rect width="320" height="220" rx="12" fill="#0B172B" stroke="#31517D"/>
  <text x="22" y="34" fill="#6AAEFF" font-family="monospace" font-size="12" letter-spacing="2">SYSTEM MONITOR</text>
  <path d="M22 49H298" stroke="#263E60"/>
  <text x="22" y="82" fill="#7E96BA" font-family="monospace" font-size="12">CURRENT MODE</text>
  <text x="298" y="82" fill="#55D6A2" font-family="monospace" font-size="13" text-anchor="end">● BUILDING</text>
  <text x="22" y="121" fill="#7E96BA" font-family="monospace" font-size="12">PRIMARY STACK</text>
